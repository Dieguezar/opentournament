name: OWASP ZAP baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Scan isolated installation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated production configuration
        shell: bash
        run: |
          cp .env.example .env
          session_secret="$(openssl rand -hex 32)"
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=${session_secret}/" .env

      - name: Start isolated installation
        run: docker compose up -d --build

      - name: Wait for the public web
        shell: bash
        run: |
          timeout 240 bash -c 'until curl --fail --silent http://127.0.0.1:4000/healthz >/dev/null; do sleep 3; done'
          timeout 240 bash -c 'until curl --fail --silent http://127.0.0.1:3000 >/dev/null; do sleep 3; done'

      - name: Run passive baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          cmd_options: '-m 1'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Show application logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove the isolated installation
        if: always()
        run: docker compose down --volumes --remove-orphans
