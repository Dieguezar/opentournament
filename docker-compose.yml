services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opentournament
      POSTGRES_PASSWORD: opentournament
      POSTGRES_DB: opentournament
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentournament -d opentournament"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://opentournament:opentournament@postgres:5432/opentournament
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-32chars}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_UNVERIFIED_EMAILS: ${ALLOW_UNVERIFIED_EMAILS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_NOTIFY_WEBHOOK_URL: ${DISCORD_NOTIFY_WEBHOOK_URL:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: opentournament
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  miniodata:
